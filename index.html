<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — نظام إدارة المستشفى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 15% 20%, rgba(15,92,92,0.10), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(201,148,42,0.10), transparent 45%),
      var(--color-bg);
  }
  .login-card {
    width: 100%;
    max-width: 400px;
    padding: 40px 36px 32px;
    text-align: center;
  }
  .login-logo {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: var(--color-primary);
    color: #fff;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
  }
  .login-title { font-size: 20px; margin-bottom: 4px; }
  .login-sub { font-size: 13.5px; color: var(--color-text-muted); margin-bottom: 26px; }
  .login-form { text-align: right; display: flex; flex-direction: column; gap: 16px; }
  #login-error {
    display: none;
    background: var(--color-danger-bg);
    color: var(--color-danger);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    text-align: center;
  }
  .login-submit { width: 100%; justify-content: center; padding: 13px; font-size: 15px; margin-top: 4px; }
  .login-footnote { margin-top: 22px; font-size: 12px; color: var(--color-text-faint); }
</style>
</head>
<body>

  <div class="card login-card">
    <div class="pulse-bar" style="margin: -40px -36px 28px; border-radius: 16px 16px 0 0;"></div>
    <div class="login-logo">ح</div>
    <h1 class="login-title">نظام إدارة المستشفى</h1>
    <p class="login-sub">سجّل الدخول للوصول إلى لوحة التحكم</p>

    <div id="login-error"></div>

    <form class="login-form" id="login-form">
      <div>
        <label class="field-label">البريد الإلكتروني</label>
        <input type="email" class="input-field" id="login-email" placeholder="name@hospital.com" required autocomplete="username">
      </div>
      <div>
        <label class="field-label">كلمة المرور</label>
        <input type="password" class="input-field" id="login-password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary login-submit" id="login-submit">
        تسجيل الدخول
      </button>
    </form>

    <div class="login-footnote">الوصول مخصص لموظفي المستشفى المصرّح لهم فقط</div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { login } from "./assets/js/auth.js";
    import { getEmployeeProfile } from "./assets/js/auth.js";

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("login-error");
    const submitBtn = document.getElementById("login-submit");

    // رسالة إذا تم تعطيل الحساب
    const params = new URLSearchParams(window.location.search);
    if (params.get("disabled") === "1") {
      errorBox.textContent = "هذا الحساب معطّل. راجع مدير النظام.";
      errorBox.style.display = "block";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "جارِ الدخول...";

      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      try {
        const user = await login(email, password);
        const profile = await getEmployeeProfile(user.uid);
        if (!profile) {
          errorBox.textContent = "الحساب موجود بنظام الدخول لكن لا يوجد له ملف موظف. راجع مدير النظام.";
          errorBox.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "تسجيل الدخول";
          return;
        }
        window.location.href = "dashboard.html";
      } catch (err) {
        console.error(err);
        let msg = "حدث خطأ أثناء تسجيل الدخول";
        if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
          msg = "البريد الإلكتروني أو كلمة المرور غير صحيحة";
        } else if (err.code === "auth/too-many-requests") {
          msg = "محاولات كثيرة فاشلة. حاول لاحقاً";
        }
        errorBox.textContent = msg;
        errorBox.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "تسجيل الدخول";
      }
    });
  </script>
</body>
</html>
