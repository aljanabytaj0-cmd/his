<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ترحيل النظام — تشغيل لمرة واحدة</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body { padding: 40px; max-width: 700px; margin: 0 auto; }
  #log { margin-top: 20px; }
  #log div { padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; background: var(--color-bg-alt); font-size: 14px; }
  #log div.err { background: var(--color-danger-bg); color: var(--color-danger); }
</style>
</head>
<body>
  <div class="card" style="padding: 28px;">
    <h2 class="font-display">ترحيل النظام لبنية الأدوار الجديدة</h2>
    <p style="color: var(--color-text-muted); font-size: 14px; margin: 10px 0 20px;">
      هذي الصفحة تُشغّل مرة واحدة بس: تزرع الصلاحيات والأدوار الافتراضية وقسم "الإدارة"،
      وتحوّل حسابك الحالي (الأدمن) للهيكلية الجديدة. بعد التشغيل الناجح، احذف هذا الملف من GitHub.
    </p>
    <label class="field-label">بريدك الإلكتروني الحالي (نفس حساب الأدمن)</label>
    <input type="email" class="input-field" id="admin-email" style="margin-bottom: 12px;">
    <label class="field-label">اسمك الكامل</label>
    <input type="text" class="input-field" id="admin-name" style="margin-bottom: 16px;">
    <button class="btn btn-primary" id="run-btn">تشغيل الترحيل</button>
    <div id="log"></div>
  </div>

<script type="module">
  import { auth, db } from "./assets/js/firebase-config.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { doc, setDoc, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { seedInitialData } from "./assets/js/api/referenceData.js";

  function log(msg, isErr = false) {
    const el = document.createElement("div");
    if (isErr) el.className = "err";
    el.textContent = msg;
    document.getElementById("log").appendChild(el);
  }

  let currentUser = null;
  onAuthStateChanged(auth, (user) => {
    if (!user) { log("يجب تسجيل الدخول أولاً من index.html بحساب الأدمن الحالي.", true); return; }
    currentUser = user;
    document.getElementById("admin-email").value = user.email || "";
    log("تم التعرف على حساب: " + user.email);
  });

  document.getElementById("run-btn").addEventListener("click", async () => {
    if (!currentUser) { log("لازم تسجّل دخول أولاً.", true); return; }
    const name = document.getElementById("admin-name").value.trim() || "الأدمن";

    try {
      // الخطوة 1: ترحيل حساب الأدمن الحالي أولاً (self-write مسموح دائماً بالقواعد)
      await setDoc(doc(db, "users", currentUser.uid), {
        name, email: currentUser.email,
        roleIds: ["admin"],
        departmentIds: [],
        active: true,
        createdAt: new Date()
      }, { merge: true });
      log("✓ تم ترحيل حسابك (" + currentUser.email + ") كأدمن بالنظام الجديد");

      // الخطوة 2: الآن بعد أن أصبحت أدمن رسمياً، نزرع باقي البيانات المرجعية
      const results = await seedInitialData();
      results.forEach(r => log("✓ " + r));

      // إنشاء قسم افتراضي "الإدارة" إن لم يوجد
      const deptSnap = await getDocs(collection(db, "departments"));
      if (deptSnap.empty) {
        await addDoc(collection(db, "departments"), { name: "الإدارة", type: "administrative", paymentModel: "per_service", active: true });
        log("✓ تم إنشاء قسم افتراضي: الإدارة");
      }

      log("🎉 اكتمل الترحيل بنجاح. يمكنك الآن حذف هذا الملف من GitHub وتسجيل الدخول عادي.");
    } catch (err) {
      console.error(err);
      log("خطأ: " + err.message, true);
    }
  });
</script>
</body>
</html>
